<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b0a">
  <title>عروض الأسعار | مناديب الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="rep-quotes.js"></script>
  <style>
    body { background: var(--bg); }
    .rq-shell { max-width: 980px; margin: 0 auto; padding: var(--space-3) var(--space-2) var(--space-6); }
    .rq-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
    .rq-header img { height: 40px; }
    .rq-card { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-3); margin-bottom: var(--space-3); }
    .rq-card h2 { margin-top: 0; font-size: 18px; }
    .rq-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-2); }
    .rq-field label { font-size: 13px; font-weight: 700; color: var(--muted); }
    .rq-field input, .rq-field select, .rq-field textarea {
      font-family: inherit; font-size: 15px; padding: 10px 12px;
      border: 1.5px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink);
    }
    .rq-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    @media (max-width: 640px) { .rq-row { grid-template-columns: 1fr; } }
    .rq-type-toggle { display: flex; gap: var(--space-1); }
    .rq-type-btn {
      flex: 1; padding: 12px; border-radius: var(--radius); border: 1.5px solid var(--line);
      background: #fff; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; color: var(--ink);
    }
    .rq-type-btn.active { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
    .rq-product-picker { display: flex; gap: var(--space-1); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .rq-product-picker select, .rq-product-picker input { flex: 1; min-width: 160px; }
    .rq-cart-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rq-cart-table th, .rq-cart-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .rq-cart-table th { color: var(--muted); font-size: 12px; }
    .rq-cart-table input[type="number"] { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; }
    .rq-remove { background: none; border: none; color: #b23; cursor: pointer; font-size: 13px; }
    .rq-totals { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-2); font-size: 15px; }
    .rq-totals .total { font-size: 20px; font-weight: 800; color: var(--brand-dark); }
    .rq-msg { font-size: 14px; margin-top: var(--space-1); }
    .rq-msg.error { color: #b23; }
    .rq-msg.ok { color: var(--forest); }
    .rq-quote-list { font-size: 14px; }
    .rq-quote-list .rq-quote-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: var(--space-1); }
    .rq-quote-item button { font-size: 12px; padding: 6px 12px; min-height: auto; }

    /* ---- طباعة العرض ---- */
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block; position: absolute; top: 0; right: 0; left: 0; padding: 24px; direction: rtl; }
      .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c8752d; padding-bottom: 12px; margin-bottom: 16px; }
      .print-header img { height: 55px; }
      .print-title { font-size: 20px; font-weight: 800; }
      .print-meta { font-size: 13px; color: #555; margin-bottom: 16px; }
      .print-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .print-table th, .print-table td { border: 1px solid #ccc; padding: 6px 8px; text-align: center; }
      .print-totals { margin-top: 16px; font-size: 14px; width: 320px; margin-inline-start: auto; }
      .print-totals .row { display: flex; justify-content: space-between; padding: 4px 0; }
      .print-totals .grand { font-weight: 800; font-size: 17px; border-top: 2px solid #17120f; margin-top: 6px; padding-top: 8px; }
      .print-footer { margin-top: 30px; font-size: 12px; color: #777; }
    }
  </style>
</head>
<body>

<div class="rq-shell">
  <div class="rq-header">
    <img src="logo.png" alt="الأصل للطاقة الشمسية">
    <div>
      <span data-user-name style="font-weight:700;"></span>
      <button class="btn" data-logout hidden style="margin-inline-start:10px;">تسجيل خروج</button>
    </div>
  </div>

  <!-- شاشة تسجيل الدخول -->
  <div class="rq-card" data-auth-panel>
    <h2>تسجيل دخول المندوب</h2>
    <form data-login-form>
      <div class="rq-field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="rq-field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">دخول</button>
      <p class="rq-msg" data-auth-message></p>
    </form>
  </div>

  <!-- لوحة إنشاء عرض السعر -->
  <div data-rep-panel hidden>

    <div class="rq-card">
      <h2>بيانات العميل</h2>
      <div class="rq-row">
        <div class="rq-field">
          <label>اسم العميل</label>
          <input type="text" id="custName" required>
        </div>
        <div class="rq-field">
          <label>رقم التليفون</label>
          <input type="tel" id="custPhone" required placeholder="01xxxxxxxxx">
        </div>
      </div>
      <div class="rq-field">
        <label>المدينة / المنطقة</label>
        <input type="text" id="custCity">
      </div>
    </div>

    <div class="rq-card">
      <h2>نوع العرض</h2>
      <div class="rq-type-toggle">
        <button type="button" class="rq-type-btn active" data-quote-type="supply_only">توريد فقط</button>
        <button type="button" class="rq-type-btn" data-quote-type="supply_install">توريد وتركيب</button>
      </div>
      <div class="rq-field" data-install-cost-wrap hidden style="margin-top:var(--space-2);">
        <label>تكلفة التركيب (تُضاف للإجمالي)</label>
        <input type="number" id="installCost" min="0" step="1" value="0">
      </div>
    </div>

    <div class="rq-card">
      <h2>إضافة منتجات للعرض</h2>
      <div class="rq-product-picker">
        <select id="categorySelect"></select>
        <select id="productSelect"></select>
        <input type="number" id="qtyInput" min="1" value="1" style="max-width:80px;">
        <button type="button" class="btn btn-primary" id="addProductBtn">إضافة</button>
      </div>
      <table class="rq-cart-table">
        <thead>
          <tr><th>المنتج</th><th>سعر الوحدة</th><th>الكمية</th><th>الإجمالي</th><th></th></tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>
      <div class="rq-totals">
        <div>الإجمالي قبل التركيب: <strong id="subtotalDisplay">0</strong> ج.م</div>
        <div data-install-total-row hidden>تكلفة التركيب: <strong id="installTotalDisplay">0</strong> ج.م</div>
        <div class="total">الإجمالي الكلي: <span id="grandTotalDisplay">0</span> ج.م</div>
      </div>
      <button type="button" class="btn btn-primary" id="saveQuoteBtn" style="margin-top:var(--space-2);">حفظ العرض وطباعته</button>
      <p class="rq-msg" data-quote-message></p>
    </div>

    <div class="rq-card">
      <h2>عروضي السابقة</h2>
      <div class="rq-quote-list" id="myQuotesList"></div>
    </div>

  </div>
</div>

<!-- منطقة الطباعة -->
<div id="printArea"></div>

</body>
</html>
