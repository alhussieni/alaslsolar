<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b0a">
  <title>بوابة الإدارة | الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../QL/rep-widgets.css">
  <style>
    /* نفس تصميم بوابة المناديب (QL/index.html): مجموعات + كروت خفيفة بدون ظل. */
    .ql-group { margin-top: 32px; }
    .ql-group:first-of-type { margin-top: 0; }
    .ql-group-title { font-size: 13px; font-weight: 800; color: var(--muted); margin: 0 0 16px; }
    .ql-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .ql-card.card {
      text-align: center; text-decoration: none; color: inherit; display: block;
      box-shadow: none; transition: border-color .15s, background .15s; padding: 24px;
    }
    .ql-card.card:hover { transform: none; box-shadow: none; border-color: var(--brand); background: var(--brand-soft); }
    .ql-card i { font-size: 28px; color: var(--brand); margin-bottom: 8px; }
    .ql-card h3 { margin: 8px 0 4px; }
    .ql-card p { font-size: 13px; color: var(--muted); margin: 0; }
    .ql-soon { display: inline-block; margin-top: 8px; padding: 1px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand-dark); font-size: 11.5px; font-weight: 800; }
    /* لوحة اليوم: أرقام صغيرة بتفتح الصفحة المعنية */
    .ql-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .ql-stat.card { display: block; text-decoration: none; color: inherit; box-shadow: none; padding: 16px 18px; transition: border-color .15s, background .15s; }
    .ql-stat.card:hover { transform: none; box-shadow: none; border-color: var(--brand); background: var(--brand-soft); }
    .ql-stat .num { display: block; font-size: 28px; font-weight: 800; line-height: 1.1; }
    .ql-stat .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 4px; }
    .ql-stat .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ql-stat.is-alert { border-color: #b23b23; }
    .ql-stat.is-alert .num { color: #b23b23; }
    .hidden { display: none !important; }
  </style>
  <link rel="stylesheet" href="/management/shell/shell.css">
  <script defer src="/management/shell/shell.js"></script>
</head>
<body>
  <main class="dashboard-shell">
    <section class="dashboard-hero">
      <a class="dashboard-logo" href="../index.html"><img src="../logo-white.png" alt="Al Asl Solar logo"></a>
      <div class="dashboard-hero-text">
        <p class="eyebrow" style="margin-bottom:2px">الأصل للطاقة الشمسية</p>
        <h1>بوابة الإدارة</h1>
        <p>دخول واحد لكل الأقسام اللي صلاحيتك تسمح بها</p>
      </div>
    </section>

    <section class="dashboard-card" id="login" data-auth-panel>
      <h2>تسجيل دخول الموظفين</h2>
      <form class="admin-form" id="login_form" style="text-align:right">
        <label for="l_id">اسم المستخدم أو البريد الإلكتروني</label>
        <input type="text" id="l_id" required autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr">
        <label for="l_pw">كلمة المرور</label>
        <input type="password" id="l_pw" required autocomplete="current-password">
        <button class="btn btn-primary" type="submit" id="l_btn">دخول</button>
        <p class="form-note" id="l_msg" role="status"></p>
      </form>
    </section>

    <section class="dashboard-content hidden" id="home">
      <div class="dashboard-toolbar">
        <div>
          <h2>أهلًا بيك، <span id="who"></span></h2>
          <p id="home_hint">اختار القسم اللي محتاجه</p>
        </div>
        <button class="btn btn-secondary dark" type="button" id="logout">تسجيل خروج</button>
      </div>
      <div class="ql-group" id="today" hidden>
        <p class="ql-group-title">اليوم</p>
        <div class="ql-stats" id="stats"></div>
      </div>
      <div id="groups"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../supabase-config.js"></script>
  <script>
  (function () {
    'use strict';
    // كل الأقسام بتشارك نفس جلسة Supabase (نفس الدومين + نفس العميل)، فالدخول من هنا بيفتح الباقي بدون دخول تاني.
    // ظهور الكارت تجميل فقط: الحماية الفعلية في RLS ودوال السيرفر.
    var EMAIL_DOMAIN = 'staff.alaslsolar.com';
    var GROUPS = [
      { title: 'العمل اليومي', modules: [
        { icon: 'fa-address-book', title: 'العملاء والمتابعة', desc: 'العملاء والمتابعات وحالة العروض وأداء المناديب', href: '../QL/rep-customers.html', any: ['customers.read_own', 'customers.read_all'] },
        { icon: 'fa-users', title: 'CRM — عروض الأسعار', desc: 'كل عروض الأسعار ونشاط المناديب المباشر', href: '../QL/rep-crm.html', any: ['crm.access'] },
        { icon: 'fa-file-invoice', title: 'عروض الأسعار (QL)', desc: 'أوف جريد، منتجات، محطات ري، ودراسات جدوى', href: '../QL/', any: ['ql.access'] }
      ] },
      { title: 'الإدارة', modules: [
        { icon: 'fa-gauge-high', title: 'لوحة التحكم', desc: 'المنتجات والمقالات والمحتوى وطلبات الموقع', href: '../dashboard.html', any: ['dashboard.access'] },
        { icon: 'fa-user-shield', title: 'إدارة الموظفين', desc: 'المستخدمون وكلمات المرور والأدوار وفتح QL', href: '../admin/staff.html', any: ['staff.manage'] },
        { icon: 'fa-industry', title: 'ERP', desc: 'المخازن والمشتريات والحسابات', href: '../erp/', any: ['erp.access'], soon: true }
      ] }
    ];

    var sb = window.getAlaslSupabase ? window.getAlaslSupabase() : null;
    var $ = function (id) { return document.getElementById(id); };

    function h(tag, attrs) {
      var el = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) { if (k === 'class') el.className = attrs[k]; else if (k === 'text') el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]); });
      for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
      return el;
    }
    function toEmail(v) { v = v.trim(); return v.indexOf('@') >= 0 ? v : v.toLowerCase() + '@' + EMAIL_DOMAIN; }
    function setMsg(t) { $('l_msg').textContent = t || ''; }

    async function render() {
      var s = (await sb.auth.getSession()).data.session;
      $('login').classList.toggle('hidden', !!s);
      $('home').classList.toggle('hidden', !s);
      if (!s) return;
      $('who').textContent = s.user.email || '';

      var r = await sb.rpc('my_permissions');
      var box = $('groups'); box.textContent = '';
      if (r.error || !Array.isArray(r.data)) { $('home_hint').textContent = 'تعذر التحقق من الصلاحيات، حدّث الصفحة.'; return; }
      var perms = r.data, total = 0;
      GROUPS.forEach(function (g) {
        var mods = g.modules.filter(function (m) { return m.any.some(function (p) { return perms.indexOf(p) >= 0; }); });
        if (!mods.length) return;
        total += mods.length;
        var cards = h('div', { 'class': 'ql-cards' });
        mods.forEach(function (m) {
          var a = h('a', { 'class': 'card ql-card', href: m.href },
            h('i', { 'class': 'fa-solid ' + m.icon, 'aria-hidden': 'true' }), h('h3', { text: m.title }), h('p', { text: m.desc }));
          if (m.soon) a.appendChild(h('span', { 'class': 'ql-soon', text: 'قيد التجهيز' }));
          cards.appendChild(a);
        });
        box.appendChild(h('div', { 'class': 'ql-group' }, h('p', { 'class': 'ql-group-title', text: g.title }), cards));
      });
      $('home_hint').textContent = total ? 'اختار القسم اللي محتاجه' : 'هذا الحساب لا يملك صلاحية لأي قسم حاليًا. تواصل مع الإدارة.';
      if (total) loadToday(perms);
    }

    function money(n) { return Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 0 }) + ' ج.م'; }

    // لوحة "اليوم": أرقام من دالة crm_today_summary (بتحترم الصلاحيات: المندوب أرقامه، الإدارة الكل)
    async function loadToday(perms) {
      var box = $('today'), stats = $('stats'); stats.textContent = ''; box.hidden = true;
      var r = await sb.rpc('crm_today_summary');
      if (r.error || !r.data) return;
      var d = r.data, tiles = [];
      var who = function (scope) { return scope === 'all' ? 'الكل' : 'خاصة بي'; };
      if ('follow_ups_overdue' in d) {
        tiles.push({ num: d.follow_ups_overdue, lbl: 'متابعات متأخرة', sub: who(d.scope_follow_ups), href: '../QL/rep-customers.html#followups', alert: d.follow_ups_overdue > 0 });
        tiles.push({ num: d.follow_ups_today, lbl: 'متابعات اليوم', sub: who(d.scope_follow_ups), href: '../QL/rep-customers.html#followups' });
      }
      if ('quotes_open' in d) {
        var qHref = perms.indexOf('crm.access') >= 0 ? '../QL/rep-crm.html' : '../QL/rep-customers.html';
        tiles.push({ num: d.quotes_open, lbl: 'عروض مفتوحة', sub: money(d.quotes_open_total) + ' — ' + who(d.scope_quotes), href: qHref });
        tiles.push({ num: d.accepted_month, lbl: 'مقبولة هذا الشهر', sub: money(d.accepted_month_total) + ' — ' + who(d.scope_quotes), href: qHref });
      }
      if ('customers' in d) tiles.push({ num: d.customers, lbl: 'عملاء', sub: who(d.scope_customers), href: '../QL/rep-customers.html' });
      if ('new_requests' in d) tiles.push({ num: d.new_requests, lbl: 'طلبات جديدة من الموقع', sub: '', href: '../dashboard.html', alert: d.new_requests > 0 });
      tiles.forEach(function (t) {
        var a = h('a', { 'class': 'card ql-stat' + (t.alert ? ' is-alert' : ''), href: t.href }, h('span', { 'class': 'num', text: Number(t.num || 0).toLocaleString('ar-EG') }), h('span', { 'class': 'lbl', text: t.lbl }));
        if (t.sub) a.appendChild(h('span', { 'class': 'sub', text: t.sub }));
        stats.appendChild(a);
      });
      box.hidden = tiles.length === 0;
    }

    async function login(e) {
      e.preventDefault();
      var id = $('l_id').value, pw = $('l_pw').value;
      setMsg('');
      if (!id || !pw) { setMsg('اكتب اسم المستخدم وكلمة المرور.'); return; }
      $('l_btn').disabled = true;
      var r = await sb.auth.signInWithPassword({ email: toEmail(id), password: pw });
      $('l_btn').disabled = false;
      if (r.error) { setMsg('بيانات الدخول غير صحيحة.'); return; }
      $('l_pw').value = '';
      await render();
    }

    if (!sb) { setMsg('تعذر الاتصال بالخادم.'); return; }
    $('login_form').addEventListener('submit', login);
    $('logout').addEventListener('click', async function () { await sb.auth.signOut(); await render(); });
    render();
  })();
  </script>
</body>
</html>
