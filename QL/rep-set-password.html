<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b0a">
  <title>تفعيل الحساب | مناديب الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="rep-widgets.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../supabase-config.js"></script>
  <script defer src="rep-set-password.js"></script>
</head>
<body>

<main class="dashboard-shell">
  <section class="dashboard-hero">
    <a class="dashboard-logo" href="index.html">
      <img src="../logo-white.png" alt="الأصل للطاقة الشمسية">
    </a>
    <div class="dashboard-hero-text">
      <p class="eyebrow" style="margin-bottom:2px">بوابة المناديب</p>
      <h1>تفعيل الحساب</h1>
    </div>
  </section>

  <section class="dashboard-card" style="max-width:420px">
    <div id="stateChecking">
      <p style="text-align:center;color:var(--muted)">جاري التحقق من الدعوة...</p>
    </div>

    <div id="stateInvalid" hidden style="text-align:center">
      <p style="color:#b23b23">اللينك ده منتهي الصلاحية أو غير صحيح. اطلب من الأدمن يبعتلك دعوة جديدة.</p>
    </div>

    <form id="setPasswordForm" hidden>
      <h2 style="margin-top:0">أهلًا بيك! حدّد كلمة المرور</h2>
      <p style="color:var(--muted);font-size:12.5px;margin:0 0 var(--space-2)">
        دي كلمة المرور اللي هتستخدمها في تسجيل الدخول من دلوقتي — محدش تاني هيشوفها.
      </p>
      <label for="newPassword">كلمة المرور</label>
      <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn btn-primary" style="margin-top:var(--space-2)">تفعيل الحساب والدخول</button>
      <p class="form-note" data-set-password-message></p>
    </form>
  </section>
</main>

</body>
</html>
