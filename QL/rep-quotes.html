<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b0a">
  <title>عروض الأسعار | مناديب الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preload" as="image" href="letterhead.jpg">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="rep-widgets.css">
  <link rel="stylesheet" href="quote-print.css">
  <script defer src="rep-header.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../supabase-config.js"></script>
  <script defer src="quote-item-utils.js"></script>
  <script defer src="product-labels.js"></script>
  <script defer src="quote-print.js"></script>
  <script defer src="rep-quotes.js"></script>
  <style>
    /* جدول البنود جوه عمود العرض — بنفس منطق الطباعة: الأعمدة بتتغيّر حسب وضع عرض الأسعار */
    .rq-cart-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rq-cart-table th, .rq-cart-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
    .rq-cart-table th { color: var(--muted); font-size: 12px; background: var(--brand-soft); }
    .rq-cart-table td.rq-name, .rq-cart-table th.rq-name { text-align: right; }
    .rq-cart-table input.cart-note { width: 100%; min-width: 130px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
    .rq-cart-table input[type="number"] { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: center; }
    .rq-empty { text-align: center; color: var(--muted); padding: 36px 18px; }
    .rq-summary { margin-top: var(--space-2); display: flex; flex-direction: column; gap: 6px; }
    .rq-summary .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 2px; border-bottom: 1px dashed var(--line); }
    .rq-internal-note { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
    .rq-add-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>

<main class="dashboard-shell">
  <section class="dashboard-hero">
    <div class="dashboard-hero-text">
      <p class="eyebrow" style="margin-bottom:2px">بوابة المناديب</p>
      <h1>عروض أسعار المنتجات</h1>
    </div>
  </section>

  <section class="dashboard-card" data-auth-panel style="max-width:420px;text-align:center">
    <h2>تسجيل دخول المندوب</h2>
    <form class="admin-form" data-login-form>
      <label for="loginEmail">البريد الإلكتروني</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label for="loginPassword">كلمة المرور</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">دخول</button>
      <p class="form-note" data-auth-message></p>
    </form>
  </section>

  <div class="rep-main rep-main--split" data-rep-panel hidden style="padding-top:0">

    <div class="dashboard-toolbar" style="position:static">
      <div>
        <h2 style="margin:0;font-size:18px" data-user-name>—</h2>
        <p class="form-note" style="margin:2px 0 0">العروض اللي أصدرتها بتلاقيها في <a href="rep-crm.html">CRM</a></p>
      </div>
      <button class="btn btn-secondary dark" data-logout>تسجيل خروج</button>
    </div>

    <div class="rep-split">

      <!-- ===== عمود الإدخال (الثلث — يمين الصفحة) ===== -->
      <div class="rep-split-input">

        <div class="card">
          <h3>بيانات العميل</h3>
          <label for="custName">اسم العميل</label>
          <input type="text" id="custName" required>
          <label for="custPhone">رقم التليفون</label>
          <input type="tel" id="custPhone" required placeholder="01xxxxxxxxx">
          <label for="custCity">المدينة / المنطقة</label>
          <input type="text" id="custCity">
        </div>

        <div class="card">
          <h3>نوع العرض</h3>
          <div class="seg">
            <button type="button" class="rq-type-btn active" data-quote-type="supply_only">توريد فقط</button>
            <button type="button" class="rq-type-btn" data-quote-type="supply_install">توريد وتركيب</button>
          </div>
          <div class="rw-field" data-install-cost-wrap hidden style="margin-top:var(--space-2)">
            <label for="installCost">تكلفة التركيب (تُضاف للإجمالي)</label>
            <input type="number" id="installCost" min="0" step="1" value="0">
          </div>
        </div>

        <div class="card">
          <h3>إضافة منتجات للعرض</h3>
          <label for="categorySelect">الفئة</label>
          <select id="categorySelect"></select>
          <label for="brandSelect">البراند</label>
          <select id="brandSelect"></select>
          <label for="productSelect">المنتج</label>
          <select id="productSelect"></select>
          <div class="rq-add-row">
            <input type="number" id="qtyInput" min="1" value="1" aria-label="الكمية">
            <button type="button" class="btn btn-primary" id="addProductBtn" style="min-height:44px">إضافة للعرض</button>
          </div>
        </div>

        <div class="card">
          <h3>طريقة عرض الأسعار</h3>
          <div class="seg">
            <button type="button" class="rq-mode-btn active" data-price-mode="detailed">تفصيلي (سعر كل بند)</button>
            <button type="button" class="rq-mode-btn" data-price-mode="total_only">إجمالي فقط</button>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;font-weight:600">
            <input type="checkbox" id="optShowTotal" checked style="width:auto;min-height:auto"> إظهار السعر الإجمالي
          </label>
          <p class="form-note" id="printOptHint"></p>
        </div>

      </div>

      <!-- ===== عمود العرض (الثلثين — شمال الصفحة) ===== -->
      <div class="rep-split-view" id="quoteShell">

        <div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;background:#faf7f2">
          <div style="display:flex;align-items:center;gap:8px">
            <img src="../logo.png" alt="الأصل للطاقة الشمسية" style="width:32px;height:32px;object-fit:contain">
            <div style="font-family:'Cairo';font-weight:700;font-size:13px;color:var(--muted)">الأصل للطاقة الشمسية</div>
          </div>
          <div>
            <div id="bannerName" style="font-family:'Cairo';font-weight:700;font-size:14px">—</div>
            <div id="bannerPhone" class="num" style="font-size:11.5px;color:var(--muted)">—</div>
          </div>
          <div style="text-align:left">
            <div class="num" style="font-size:12.5px;color:var(--muted)" id="bannerDate">—</div>
          </div>
        </div>

        <div class="card">
          <h3>عرض السعر <span class="tag" id="quoteTypeTag">توريد فقط</span></h3>
          <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
            <table class="rq-cart-table">
              <thead id="cartHead"></thead>
              <tbody id="cartBody"></tbody>
            </table>
          </div>

          <div class="rq-summary" id="quoteSummary">
            <div class="row" data-row-subtotal><span>الإجمالي قبل التركيب</span><strong class="num"><span id="subtotalDisplay">0</span> ج.م</strong></div>
            <div class="row" data-install-total-row hidden><span>تكلفة التركيب</span><strong class="num"><span id="installTotalDisplay">0</span> ج.م</strong></div>
          </div>
          <div class="totalbar" data-grand-bar>
            <div class="lbl">الإجمالي الكلي</div>
            <div class="big num"><span id="grandTotalDisplay">0</span> ج.م</div>
          </div>
          <p class="rq-internal-note" data-internal-note hidden></p>

          <button type="button" class="btn btn-primary" id="saveQuoteBtn" style="width:100%;margin-top:16px">
            <i class="fa-solid fa-print"></i> حفظ العرض وطباعته
          </button>
          <p class="form-note" data-quote-message></p>
        </div>

      </div>
    </div>

  </div>
</main>

<div id="printArea"></div>

</body>
</html>
