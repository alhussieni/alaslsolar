name: Generate Content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '0 */12 * * *'  # كل 12 ساعة (00:00 و 12:00 UTC)

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run content generator (articles + projects)
        run: npm run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate articles and projects [skip ci]"
          file_pattern: "articles/ articles.html projects/ projects.html sitemap.xml"
