<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b0a">
  <title>عرض سعر أوف جريد | مناديب الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="offgrid-calc-engine.js"></script>
  <script defer src="rep-offgrid-quote.js"></script>
  <style>
    body { background: var(--bg); }
    .rq-shell { max-width: 980px; margin: 0 auto; padding: var(--space-3) var(--space-2) var(--space-6); }
    .rq-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
    .rq-header img { height: 40px; }
    .rq-card { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-3); margin-bottom: var(--space-3); }
    .rq-card h2 { margin-top: 0; font-size: 18px; }
    .rq-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-2); }
    .rq-field label { font-size: 13px; font-weight: 700; color: var(--muted); }
    .rq-field input, .rq-field select, .rq-field textarea {
      font-family: inherit; font-size: 15px; padding: 10px 12px;
      border: 1.5px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink);
    }
    .rq-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .rq-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-2); }
    @media (max-width: 640px) { .rq-row, .rq-row3 { grid-template-columns: 1fr; } }
    .rq-type-toggle { display: flex; gap: var(--space-1); }
    .rq-type-btn {
      flex: 1; padding: 12px; border-radius: var(--radius); border: 1.5px solid var(--line);
      background: #fff; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; color: var(--ink);
    }
    .rq-type-btn.active { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
    .rq-loads-picker { display: flex; gap: var(--space-1); margin-bottom: var(--space-2); }
    .rq-loads-picker select { flex: 1; }
    table.rq-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.rq-table th, table.rq-table td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; }
    table.rq-table th { color: var(--muted); font-size: 11px; }
    table.rq-table input[type="number"] { width: 60px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; text-align: center; }
    .rq-remove { background: none; border: none; color: #b23; cursor: pointer; font-size: 12px; }
    .rq-msg { font-size: 14px; margin-top: var(--space-1); }
    .rq-msg.error { color: #b23; }
    .rq-msg.ok { color: var(--forest); }
    .rq-quote-table input[type="number"] { width: 55px; padding: 3px; border: 1px solid var(--line); border-radius: 6px; text-align: center; }
    .rq-totals { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-2); font-size: 15px; }
    .rq-totals .total { font-size: 20px; font-weight: 800; color: var(--brand-dark); }

    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block; position: absolute; top: 0; right: 0; left: 0; padding: 24px; direction: rtl; }
      .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c8752d; padding-bottom: 12px; margin-bottom: 16px; }
      .print-header img { height: 55px; }
      .print-title { font-size: 20px; font-weight: 800; }
      .print-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .print-table th, .print-table td { border: 1px solid #ccc; padding: 6px 8px; text-align: center; }
      .print-totals { margin-top: 16px; font-size: 14px; width: 320px; margin-inline-start: auto; }
      .print-totals .row { display: flex; justify-content: space-between; padding: 4px 0; }
      .print-totals .grand { font-weight: 800; font-size: 17px; border-top: 2px solid #17120f; margin-top: 6px; padding-top: 8px; }
      .print-footer { margin-top: 30px; font-size: 12px; color: #777; }
    }
  </style>
</head>
<body>

<div class="rq-shell">
  <div class="rq-header">
    <img src="logo.png" alt="الأصل للطاقة الشمسية">
    <div>
      <a href="rep-quotes.html" class="btn" style="min-height:36px;font-size:13px;">عروض عامة ←</a>
      <span data-user-name style="font-weight:700; margin-inline-start:10px;"></span>
    </div>
  </div>

  <div class="rq-card" data-auth-panel>
    <h2>لازم تسجّل دخولك كمندوب الأول</h2>
    <p style="color:var(--muted);">سجّل دخولك من <a href="rep-quotes.html">صفحة عروض الأسعار</a> ثم ارجع هنا.</p>
  </div>

  <div data-rep-panel hidden>

    <div class="rq-card">
      <h2>بيانات العميل</h2>
      <div class="rq-row">
        <div class="rq-field"><label>اسم العميل</label><input type="text" id="custName" required></div>
        <div class="rq-field"><label>رقم التليفون</label><input type="tel" id="custPhone" required></div>
      </div>
      <div class="rq-field"><label>المدينة / المنطقة</label><input type="text" id="custCity"></div>
    </div>

    <div class="rq-card">
      <h2>نوع العرض</h2>
      <div class="rq-type-toggle">
        <button type="button" class="rq-type-btn active" data-quote-type="supply_only">توريد فقط</button>
        <button type="button" class="rq-type-btn" data-quote-type="supply_install">توريد وتركيب</button>
      </div>
    </div>

    <div class="rq-card">
      <h2>الأحمال المطلوب تشغيلها</h2>
      <div class="rq-loads-picker">
        <select id="ogLoadPicker"></select>
        <button type="button" class="btn btn-primary" id="ogAddLoadBtn">إضافة</button>
      </div>
      <table class="rq-table">
        <thead><tr><th>الجهاز</th><th>وات</th><th>العدد</th><th>ساعات نهار</th><th>ساعات ليل</th><th></th></tr></thead>
        <tbody id="ogLoadsBody"></tbody>
      </table>
    </div>

    <div class="rq-card">
      <h2>إعدادات النظام</h2>
      <div class="rq-row3">
        <div class="rq-field"><label>ماركة الإنفرتر</label><select id="ogInvBrand"></select></div>
        <div class="rq-field"><label>ماركة البطارية</label><select id="ogBattBrand"></select></div>
        <div class="rq-field"><label>ماركة الألواح</label><select id="ogPanelBrand"></select></div>
      </div>
      <div class="rq-row3">
        <div class="rq-field"><label>الطور</label>
          <select id="ogPhase"><option value="single">أحادي</option><option value="three">ثلاثي</option></select>
        </div>
        <div class="rq-field"><label>ساعات الشمس (PSH)</label><input type="number" id="ogPsh" value="6" step="0.1"></div>
        <div class="rq-field"><label>أيام الاستقلالية</label><input type="number" id="ogAutonomy" value="0" step="1"></div>
      </div>
      <label style="display:flex; gap:6px; align-items:center; font-size:14px;"><input type="checkbox" id="ogMorning" checked> تشغيل الأحمال الصباحية</label>
      <label style="display:flex; gap:6px; align-items:center; font-size:14px; margin-top:6px;"><input type="checkbox" id="ogNight" checked> تشغيل الأحمال الليلية</label>
      <button type="button" class="btn btn-primary" id="ogCalcBtn" style="margin-top:var(--space-2);">احسب النظام</button>
      <p class="rq-msg" data-calc-message></p>
    </div>

    <div class="rq-card" data-quote-section hidden>
      <h2>عرض السعر (قابل للتعديل والخصم)</h2>
      <table class="rq-table rq-quote-table">
        <thead><tr><th>البند</th><th>الكمية</th><th>سعر الوحدة</th><th>خصم %</th><th>الإجمالي</th></tr></thead>
        <tbody id="quoteItemsBody"></tbody>
      </table>
      <div class="rq-totals">
        <div class="total">الإجمالي بعد الخصم: <span id="grandTotalDisplay">0</span> ج.م</div>
      </div>
      <button type="button" class="btn btn-primary" id="saveQuoteBtn" style="margin-top:var(--space-2);">حفظ العرض وطباعته</button>
      <p class="rq-msg" data-quote-message></p>
    </div>

  </div>
</div>

<div id="printArea"></div>

</body>
</html>
